# ================================================
# 优化奖励函数配置 - 增加正向激励
# 智能体视为质点（半径=0）
# ================================================

# ================================
# 归一化参数
# ================================
max_distance: 30.0
formation_norm: 10.0

# ================================
# 碰撞惩罚参数（降低惩罚强度）
# ================================
collision_penalty: -0.5
danger_threshold: 0.5

# ================================
# 进度奖励参数（增加正向激励）
# ================================
progress_scale: 1.0
max_progress_reward: 1.0

# ================================
# 目标奖励参数（大额正向激励）
# ================================
goal_reward: 2.0

# ================================
# 时间惩罚（减小）
# ================================
time_penalty: -0.001

# ================================
# 权重参数（增加正向激励权重）
# ================================
w_formation: 1.5
w_collision: 3.0
w_progress: 2.0
w_goal: 5.0
w_time: 0.05
